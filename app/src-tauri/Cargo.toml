[package]
name = "app"
version = "0.1.0"
description = "A Tauri App for Gradfast Downloader"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"

# Tauri
tauri = { version = "2.3.1", features = [] }
tauri-plugin-log = "2.0.0-rc"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "deflate"] }

# Cookie storage
reqwest_cookie_store = "0.8"
cookie = "0.18"
cookie_store = "0.21"
nescookie = "0.3.0"

# Retry logic
retry = "2.0"

# Random user agent
fake_user_agent = "0.1"

# Random number generation
rand = "0.8"

# Directory handling (for cookie file path)
dirs = "5"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# URL parsing
url = "2.5"

# URL encoding
urlencoding = "2.1"

# Time handling (for cookies)
time = "0.3"

# Enums
strum = { version = "0.28.0", features = ["derive"] }

# Dev dependencies (for examples and tests)
[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.dev.package.objc2]
debug-assertions = false
